<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O'Neill Invaders</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
canvas{display:block;margin:0 auto;background:#000;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=600;cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='Digit1')weapon=0;
  if(e.code==='Digit2')weapon=1;
  if(e.code==='Digit3')weapon=2;
  if(e.code==='Enter'&&state!=='play')start();
});
addEventListener('keyup',e=>keys[e.code]=false);

let touchX=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();touchX=e.touches[0].clientX;if(state!=='play')start();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();touchX=e.touches[0].clientX;},{passive:false});
cv.addEventListener('touchend',()=>touchX=null);

const stars=[...Array(120)].map(()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5}));
const WEAPONS=[
  {name:'Laser',color:'#0ff',delay:250},
  {name:'Spread',color:'#ff0',delay:400},
  {name:'Plasma',color:'#f0f',delay:650}
];
let state='title',ship={x:W/2,y:H-60},bullets=[],bombs=[],aliens=[],parts=[];
let score=0,lives=3,wave=0,dir=1,weapon=0,lastShot=0;
let hi=+localStorage.getItem('hi')||0;

function start(){state='play';score=0;lives=3;wave=0;weapon=0;nextWave();}
function nextWave(){
  wave++;ship={x:W/2,y:H-60};bullets=[];bombs=[];dir=1;lastShot=0;aliens=[];
  for(let r=0;r<5;r++)for(let c=0;c<10;c++)
    aliens.push({x:110+c*60,y:70+r*45,type:r<1?2:r<3?1:0,alive:true});
}

function shoot(t){
  const w=WEAPONS[weapon];if(t-lastShot<w.delay)return;lastShot=t;
  if(weapon===0)bullets.push({x:ship.x,y:ship.y-28,vx:0,vy:-9,r:3,c:w.color});
  if(weapon===1)[-2.5,0,2.5].forEach(v=>bullets.push({x:ship.x,y:ship.y-28,vx:v,vy:-8,r:3,c:w.color}));
  if(weapon===2)bullets.push({x:ship.x,y:ship.y-28,vx:0,vy:-6,r:9,c:w.color,pierce:true});
}

function boom(x,y,c){for(let i=0;i<22;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:40,c});}

function update(t){
  stars.forEach(s=>{s.y+=s.s;if(s.y>H)s.y=0;});
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  parts=parts.filter(p=>p.life>0);
  if(state!=='play')return;
  const sp=6;
  if(keys.ArrowLeft)ship.x-=sp;
  if(keys.ArrowRight)ship.x+=sp;
  if(touchX!==null){
    const r=cv.getBoundingClientRect(),tx=(touchX-r.left)/r.width*W;
    ship.x+=Math.sign(tx-ship.x)*Math.min(sp,Math.abs(tx-ship.x));shoot(t);
  }
  ship.x=Math.max(30,Math.min(W-30,ship.x));
  if(keys.Space)shoot(t);

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  const live=aliens.filter(a=>a.alive);
  if(!live.length){nextWave();return;}
  const speed=(0.6+wave*0.3)*(1+(50-live.length)/25);
  let edge=false;
  live.forEach(a=>{a.x+=dir*speed;if(a.x<25||a.x>W-25)edge=true;});
  if(edge){dir*=-1;live.forEach(a=>a.y+=18);}

  if(Math.random()<0.015+wave*0.005){const a=live[Math.floor(Math.random()*live.length)];bombs.push({x:a.x,y:a.y+15});}
  bombs.forEach(b=>b.y+=3+wave*0.3);

  bullets.forEach(b=>live.forEach(a=>{
    if(a.alive&&!b.dead&&Math.abs(b.x-a.x)<20+b.r&&Math.abs(b.y-a.y)<15+b.r){
      a.alive=false;score+=(a.type+1)*10;boom(a.x,a.y,['#3f6','#f90','#f33'][a.type]);
      if(!b.pierce)b.dead=true;
    }
  }));
  bombs.forEach(b=>{if(state==='play'&&Math.abs(b.x-ship.x)<22&&Math.abs(b.y-ship.y)<18){b.y=H+1;hit();}});
  bullets=bullets.filter(b=>b.y>-20&&!b.dead);
  bombs=bombs.filter(b=>b.y<H);
  if(state==='play'&&live.some(a=>a.alive&&a.y>ship.y-30))gameOver();
}

function hit(){boom(ship.x,ship.y,'#0cf');lives--;if(lives<=0)gameOver();}
function gameOver(){state='over';if(score>hi){hi=score;localStorage.setItem('hi',hi);}}

function drawShip(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor='#0cf';ctx.shadowBlur=18;
  const g=ctx.createLinearGradient(0,-28,0,18);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.5,'#8cf');g.addColorStop(1,'#246');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(0,-28);ctx.lineTo(8,-8);ctx.lineTo(26,10);ctx.lineTo(26,16);ctx.lineTo(8,12);
  ctx.lineTo(5,18);ctx.lineTo(-5,18);ctx.lineTo(-8,12);ctx.lineTo(-26,16);ctx.lineTo(-26,10);
  ctx.lineTo(-8,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#0ff';ctx.beginPath();ctx.ellipse(0,-6,4,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=Math.random()<0.5?'#f80':'#ff0';
  ctx.beginPath();ctx.moveTo(-4,18);ctx.lineTo(0,26+Math.random()*8);ctx.lineTo(4,18);ctx.fill();
  ctx.restore();
}

function drawAlien(a,t){
  ctx.save();ctx.translate(a.x,a.y+Math.sin(t/200+a.x/50)*2);
  if(a.type===0){
    ctx.shadowColor='#3f6';ctx.shadowBlur=12;ctx.fillStyle='#3f6';
    ctx.beginPath();ctx.ellipse(0,0,16,12,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#3f6';ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*8,10);ctx.lineTo(i*10+Math.sin(t/150+i)*3,18);ctx.stroke();}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-2,4,0,Math.PI*2);ctx.arc(5,-2,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-5,-2,2,0,Math.PI*2);ctx.arc(5,-2,2,0,Math.PI*2);ctx.fill();
  }else if(a.type===1){
    ctx.shadowColor='#f90';ctx.shadowBlur=12;
    ctx.fillStyle='#fd8';ctx.beginPath();ctx.arc(0,0,9,Math.PI,0);ctx.fill();
    ctx.fillStyle='#f90';ctx.beginPath();ctx.ellipse(0,3,21,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=Math.floor(t/200)%2?'#ff0':'#fff';
    [-12,0,12].forEach(i=>{ctx.beginPath();ctx.arc(i,4,2,0,Math.PI*2);ctx.fill();});
  }else{
    ctx.shadowColor='#f33';ctx.shadowBlur=14;ctx.fillStyle='#f33';
    ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(17,0);ctx.lineTo(0,15);ctx.lineTo(-17,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function text(s,x,y,size,c){ctx.fillStyle=c;ctx.font='bold '+size+'px Arial';ctx.textAlign='center';ctx.fillText(s,x,y);}

function draw(t){
  ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';stars.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));
  parts.forEach(p=>{ctx.globalAlpha=p.life/40;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);});ctx.globalAlpha=1;
  if(state==='title'){
    text("O'NEILL INVADERS",W/2,220,52,'#0cf');
    text('Arrows to move, Space to fire',W/2,300,22,'#fff');
    text('Press 1, 2 or 3 to change weapon',W/2,335,22,'#fff');
    text('On a phone: touch and drag',W/2,370,22,'#fff');
    text('Press Enter or tap to start',W/2,440,26,'#ff0');
    return;
  }
  aliens.forEach(a=>{if(a.alive)drawAlien(a,t);});
  bullets.forEach(b=>{ctx.shadowColor=b.c;ctx.shadowBlur=12;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
  ctx.shadowBlur=0;
  bombs.forEach(b=>{ctx.fillStyle='#f44';ctx.fillRect(b.x-2,b.y-6,4,12);});
  if(state==='play')drawShip(ship.x,ship.y);
  ctx.shadowBlur=0;
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 18px Arial';
  ctx.fillText('Score: '+score,15,25);ctx.fillText('Best: '+hi,160,25);
  ctx.fillText('Wave: '+wave,300,25);ctx.fillText('Lives: '+lives,420,25);
  ctx.fillStyle=WEAPONS[weapon].color;ctx.fillText('Weapon: '+WEAPONS[weapon].name,560,25);
  if(state==='over'){
    text('GAME OVER',W/2,260,56,'#f33');
    text('Score: '+score,W/2,320,28,'#fff');
    text('Press Enter or tap to play again',W/2,380,24,'#ff0');
  }
}

function loop(t){update(t||0);draw(t||0);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
